<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d3df5">
<title>BiblioScan — OCR réel</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#171522;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
header{background:linear-gradient(145deg,#5d2eea,#8c63ff);color:#fff;padding:28px 20px;border-radius:0 0 28px 28px}.wrap{max-width:760px;margin:auto}
main{padding:20px 16px 50px}.card{background:#fff;border:1px solid #ebe8f2;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 8px 30px #2516500b}
.drop{text-align:center;border:2px dashed #c9bdf7;padding:28px 18px}.icon{font-size:42px}.muted{color:#777487;font-size:14px;line-height:1.45}
.btn{border:0;border-radius:14px;background:#6d3df5;color:#fff;padding:14px 18px;font-weight:800;font-size:15px;margin:6px 4px 0;cursor:pointer}.secondary{background:#eeeafd;color:#5731cf}
input{display:none}.preview{display:none}.preview img{width:100%;max-height:440px;object-fit:contain;border-radius:16px;background:#111}.actions{text-align:center}.status{margin:14px 2px;color:#6f6a7b;font-size:14px}.bar{height:8px;background:#eeeaf6;border-radius:10px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#6d3df5;transition:width .2s}
.results{display:grid;gap:12px}.book{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.book:last-child{border:0}.cover{width:60px;height:84px;border-radius:8px;background:#e9e4ff;display:grid;place-items:center;font-size:25px;flex:none}.grow{flex:1}.score{font-size:21px;font-weight:900;color:#6d3df5}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:#f0ebff;color:#5b32d5;font-size:11px;font-weight:800;margin-top:4px}.raw{font-size:13px;line-height:1.5;background:#f7f6fb;border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}
</style>
</head>
<body>
<header><div class="wrap"><b>📚 BiblioScan</b><h1>Reconnaissance réelle des livres</h1><p>Cette version lit le texte de ta photo puis cherche les ouvrages correspondants.</p></div></header>
<main class="wrap">
<section class="card drop">
  <div class="icon">📷</div><h2>Scanner une étagère</h2>
  <p class="muted">Pour de meilleurs résultats : photo nette, bonne lumière et tranches assez grandes.</p>
  <button type="button" class="btn" id="take">📷 Prendre une photo</button>
  <button type="button" class="btn secondary" id="choose">🖼️ Choisir dans Photos</button>
  <input id="camera" type="file" accept="image/*" capture="environment">
  <input id="library" type="file" accept="image/*">
</section>

<section class="card preview" id="preview">
  <img id="img" alt="Photo de l'étagère">
  <div class="actions">
    <button type="button" class="btn" id="analyze">🔎 Analyser réellement</button>
    <button type="button" class="btn secondary" id="change">Changer</button>
  </div>
</section>

<section id="progress" class="card" style="display:none">
  <b id="progressText">Préparation…</b>
  <div class="bar"><i id="progressBar"></i></div>
</section>

<section id="out"></section>
</main>

<script>
const camera=document.querySelector('#camera'),library=document.querySelector('#library');
const preview=document.querySelector('#preview'),img=document.querySelector('#img');
const progress=document.querySelector('#progress'),progressText=document.querySelector('#progressText'),progressBar=document.querySelector('#progressBar'),out=document.querySelector('#out');
let selectedFile=null;

function setFile(file){if(!file)return;selectedFile=file;img.src=URL.createObjectURL(file);preview.style.display='block';out.innerHTML='';}
document.querySelector('#take').onclick=()=>camera.click();
document.querySelector('#choose').onclick=()=>library.click();
camera.onchange=()=>setFile(camera.files[0]);
library.onchange=()=>setFile(library.files[0]);
document.querySelector('#change').onclick=()=>{camera.value='';library.value='';selectedFile=null;preview.style.display='none';out.innerHTML='';};

function setProgress(text,pct){progress.style.display='block';progressText.textContent=text;progressBar.style.width=pct+'%';}

function cleanLines(text){
  return [...new Set(text.split(/\n+/).map(x=>x.replace(/[|_~]+/g,' ').replace(/\s+/g,' ').trim())
    .filter(x=>x.length>=4 && /[A-Za-zÀ-ÿ]/.test(x))
    .filter(x=>!/^([0-9\s.,-]+)$/.test(x)))].slice(0,18);
}

async function googleBooks(q){
  const url='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=5&printType=books';
  const r=await fetch(url); if(!r.ok) throw new Error('Recherche bibliographique indisponible');
  const d=await r.json(); return (d.items||[]).map(v=>v.volumeInfo);
}
function priority(info){
  let s=35;
  if(info.industryIdentifiers?.length)s+=20;
  if(info.publishedDate){const y=parseInt(info.publishedDate.slice(0,4));if(y&&y<1980)s+=25;else if(y&&y<2000)s+=12;}
  if(info.authors?.length)s+=10;
  if(info.imageLinks)s+=5;
  return Math.min(99,s);
}
function cleanLines(text){
  return [...new Set(text.split(/\n+/).map(x=>x.replace(/[|_~]+/g,' ').replace(/\s+/g,' ').trim())
    .filter(x=>x.length>=4 && /[A-Za-zÀ-ÿ]/.test(x))
    .filter(x=>!/^([0-9\s.,-]+)$/.test(x)))].slice(0,30);
}
function card(info,score,query){
  return `<article class="book"><div class="cover">📖</div><div class="grow"><b>${info.title||'Ouvrage identifié'}</b><div class="muted">${(info.authors||[]).join(', ')||'Auteur à confirmer'}</div><div class="tag">Priorité ${score}/100</div><div class="muted">${info.publishedDate||'Date inconnue'}${info.industryIdentifiers?' • ISBN '+info.industryIdentifiers.map(x=>x.identifier).join(' · '):''}</div><div class="muted">OCR : ${query}</div></div></article>`;
}
async function makeRows(file,rows=5){
  const bitmap=await createImageBitmap(file), w=bitmap.width,h=bitmap.height;
  const cv=document.createElement('canvas'); cv.width=w;cv.height=h;
  const c=cv.getContext('2d',{willReadFrequently:true});c.drawImage(bitmap,0,0);
  const d=c.getImageData(0,0,w,h).data;let minX=w,maxX=0,minY=h,maxY=0;
  for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){const i=(y*w+x)*4,lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];if(lum>28){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}}
  if(maxX<=minX){minX=0;maxX=w;minY=0;maxY=h;}
  const W=maxX-minX,H=maxY-minY,out=[];
  for(let r=0;r<rows;r++){
    const y0=Math.max(0,Math.floor(r*H/rows-H*.025)),y1=Math.min(H,Math.ceil((r+1)*H/rows+H*.025));
    const x=document.createElement('canvas');x.width=Math.max(1000,W*2);x.height=Math.max(240,(y1-y0)*2);
    const z=x.getContext('2d');z.filter='contrast(1.25) saturate(.75)';z.drawImage(bitmap,minX,minY+y0,W,y1-y0,0,0,x.width,x.height);out.push(x);
  }
  return out;
}
document.querySelector('#analyze').onclick=async()=>{
  if(!selectedFile)return;
  out.innerHTML='';
  try{
    setProgress('Préparation de la photo…',5);
    const rows=await makeRows(selectedFile,5);
    Tesseract.createWorker('fra',1,{logger:m=>{
  if(m.status==='recognizing text') setProgress('Lecture des tranches…',50);
}})
      if(m.status==='recognizing text')setProgress('Lecture des tranches… '+Math.round((m.progress||0)*100)+'%',10+Math.round((m.progress||0)*55));
    }});
    const all=[];
    for(let i=0;i<rows.length;i++){
      setProgress('Lecture de l’étagère '+(i+1)+'/5…',15+i*12);
      const r=await worker.recognize(rows[i]); all.push(...cleanLines(r.data.text||''));
    }
    await worker.terminate();
    const lines=[...new Set(all)].slice(0,35);
    setProgress('Recherche des correspondances…',78);
    const matches=[];
    for(const line of lines.slice(0,12)){
      try{const infos=await googleBooks(line);if(infos[0])matches.push({line,info:infos[0],score:priority(infos[0])});}catch(e){}
      setProgress('Recherche : '+line.slice(0,42),78+Math.min(20,Math.round(matches.length/12*20)));
    }
    matches.sort((a,b)=>b.score-a.score);
    progressText.textContent='Analyse terminée.';progressBar.style.width='100%';
    out.innerHTML=`<section class="card"><h2>📚 Livres identifiés</h2><p class="muted">${matches.length} correspondance(s). Le score est une priorité de vérification, pas une valeur de revente.</p><div class="results">${matches.length?matches.map(x=>card(x.info,x.score,x.line)).join(''):'<p class="muted">Aucune correspondance fiable. Essaie une photo plus proche d’une seule rangée.</p>'}</div></section><section class="card"><h3>🔤 Texte réellement lu</h3><div class="raw">${lines.join('\\n')}</div></section>`;
  }catch(e){progressText.textContent='Erreur pendant l’analyse.';out.innerHTML='<section class="card"><h2>⚠️ Analyse impossible</h2><p class="muted">'+(e.message||e)+'</p></section>';}
};
</script>
</body></html>
